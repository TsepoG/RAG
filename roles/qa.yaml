# Role profile: edit the wording freely, and raise `version` by one whenever you change anything.
id: qa
displayName: QA / Tester
description: Test scenarios, expected results and edge cases, from acceptance criteria and validation rules.
audience: Testers who need inputs, validations and error states to design and run tests.
depth: 2
vocabulary:
  - Do list scenarios with the input, the action and the expected result.
  - Do call out validations, limits and error messages exactly as the sources state them.
  - Do add edge cases and boundary values.
  - Don't explain implementation internals.
bannedTerms:
  - class
  - refactor
sourcePriority:
  - confluence
  - github
answerShape:
  - A table of scenarios with input and expected result.
  - The expected results in more detail where needed.
  - Edge cases and boundary values.
examples:
  - question: How do we decide if a refund is allowed?
    answer: >-
      Scenarios. A refund requested on day 30 is accepted [C1]. A refund requested on day 31 is
      refused [C1]. A second refund on the same order is refused [C1]. A refund of 5001 waits for
      manager approval [C1][G1]. Edge cases to check are an order exactly 30 days old and an
      amount of exactly 5000.
# Shown under Try asking on the welcome screen. Each question is one the evaluation showed the assistant can answer.
suggestedQuestions:
  - Which known stock splits must the price tests cover?
  - What kinds of companies must the golden-file fixture set include?
  - At what coverage level should the team be alerted for a concept in a given year?
version: 1

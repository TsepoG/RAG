<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Role-Aware Knowledge Assistant</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <script type="module" src="/js/main.js"></script>
  </head>
  <body>
    <nav class="skip-nav" aria-label="Skip links">
      <a class="skip" href="#question">Skip to the question</a>
    </nav>

    <noscript><p class="error">This page needs JavaScript to ask questions.</p></noscript>

    <div class="app">
      <div id="mobile-bar"></div>
      <div id="backdrop" class="backdrop" hidden></div>
      <aside id="sidebar" class="sidebar" aria-label="Conversation settings"></aside>

      <main class="main">
        <div class="column">
          <h1 class="visually-hidden">Knowledge Assistant</h1>
          <output id="notice" class="notice-bar" hidden></output>
          <div id="welcome"></div>
          <ol id="messages" class="messages" aria-label="Conversation"></ol>
          <output id="live" class="visually-hidden" aria-live="polite"></output>
          <div id="end"></div>
          <div id="composer" class="composer-slot"></div>
        </div>
      </main>
    </div>
  </body>
</html>

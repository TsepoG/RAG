# Project key and organization are not set here; CI passes them from repository variables
# (-Dsonar.projectKey, -Dsonar.organization). See .github/workflows/ci.yml.
sonar.sources=src,public
sonar.tests=test
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=coverage/**,node_modules/**
# Mirrors the coverage exclusion in vitest.config.js: the entry points and src/cli are wiring only.
sonar.coverage.exclusions=src/server/index.js,src/cli/**,public/js/main.js
